<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Inventaris Alat Laboratorium Fisika</title>
    <style>
        :root {
            --deep-navy: #0F2342;
            --navy-hover: #183461;
            --sky-blue: #38BDF8;
            --sky-soft: #E0F2FE;
            --warm-cream: #FBF9F5;
            --pure-white: #FFFFFF;
            --text-main: #0F2342;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            --error-bg: #FEF2F2;
            --error-text: #DC2626;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--warm-cream);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background-color: var(--pure-white);
            width: 100%;
            max-width: 410px;
            border-radius: 18px;
            padding: 36px 32px;
            box-shadow: 0 12px 30px rgba(15, 35, 66, 0.08);
            border: 1px solid var(--border-color);
            border-top: 5px solid var(--deep-navy);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-badge {
            width: 52px;
            height: 52px;
            background-color: var(--deep-navy);
            color: var(--sky-blue);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
        }

        .header h1 { font-size: 1.4rem; color: var(--deep-navy); margin-bottom: 4px; }
        .header p { font-size: 0.85rem; color: var(--text-muted); }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }

        .input-wrapper { position: relative; display: flex; align-items: center; }

        .form-control {
            width: 100%;
            padding: 11px 14px;
            font-size: 0.92rem;
            color: var(--deep-navy);
            background-color: var(--warm-cream);
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            outline: none;
        }

        .form-control:focus {
            background-color: var(--pure-white);
            border-color: var(--sky-blue);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            background-color: var(--deep-navy);
            color: var(--pure-white);
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .btn-submit:hover { background-color: var(--navy-hover); }

        .alert-box {
            display: none;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.83rem;
            margin-bottom: 16px;
            background-color: var(--error-bg);
            color: var(--error-text);
            border: 1px solid #FECACA;
        }

        .demo-credentials {
            margin-top: 24px;
            padding: 12px 14px;
            background-color: var(--warm-cream);
            border-radius: 10px;
            border: 1px dashed #CBD5E1;
            font-size: 0.8rem;
        }

        .demo-title { font-weight: 700; margin-bottom: 8px; color: var(--deep-navy); }

        .cred-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #E2E8F0;
            cursor: pointer;
        }

        .cred-item:last-child { border-bottom: none; padding-bottom: 0; }
        .cred-item:hover { opacity: 0.75; }

        .role-tag {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 5px;
            text-transform: uppercase;
        }

        .role-editor { background-color: var(--deep-navy); color: var(--sky-blue); }
        .role-viewer { background-color: var(--sky-soft); color: var(--deep-navy); }
        .cred-detail { color: var(--text-muted); font-family: monospace; font-size: 0.78rem; }
    </style>
</head>
<body>

    <main class="login-card">
        <div class="header">
            <div class="logo-badge">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="2"/>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" transform="rotate(30 12 12)"/>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" transform="rotate(-30 12 12)"/>
                </svg>
            </div>
            <h1>Inventaris Lab Fisika</h1>
            <p>Masuk untuk mengakses sistem pendataan alat</p>
        </div>

        <div id="alertBox" class="alert-box"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" class="form-control" placeholder="nama@labfisika.ac.id" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" class="form-control" placeholder="Masukkan password" required>
                    <button type="button" class="toggle-password" id="togglePassword">Lihat</button>
                </div>
            </div>

            <button type="submit" class="btn-submit">Masuk</button>
        </form>

        <div class="demo-credentials">
            <div class="demo-title">Akun Demo (Klik untuk isi otomatis):</div>
            <div class="cred-item" onclick="fillAccount('editor@labfisika.ac.id', 'EditorFisika#2026')">
                <span class="role-tag role-editor">Editor</span>
                <span class="cred-detail">editor@labfisika.ac.id</span>
            </div>
            <div class="cred-item" onclick="fillAccount('viewer@labfisika.ac.id', 'ViewerFisika#2026')">
                <span class="role-tag role-viewer">Viewer</span>
                <span class="cred-detail">viewer@labfisika.ac.id</span>
            </div>
        </div>
    </main>

    <script>
        const ACCOUNTS = {
            "editor@labfisika.ac.id": { password: "EditorFisika#2026", role: "Editor" },
            "viewer@labfisika.ac.id": { password: "ViewerFisika#2026", role: "Viewer" }
        };

        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const alertBox = document.getElementById('alertBox');

        document.getElementById('togglePassword').addEventListener('click', function() {
            const isPwd = passwordInput.type === 'password';
            passwordInput.type = isPwd ? 'text' : 'password';
            this.textContent = isPwd ? 'Sembunyi' : 'Lihat';
        });

        function fillAccount(email, password) {
            emailInput.value = email;
            passwordInput.value = password;
            alertBox.style.display = 'none';
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value;
            const user = ACCOUNTS[email];

            if (user && user.password === password) {
                localStorage.setItem('simlab_active_user', JSON.stringify({
                    email: email,
                    role: user.role
                }));
                window.location.href = 'dashboard.html';
            } else {
                alertBox.textContent = 'Email atau password salah. Silakan klik akun demo di bawah.';
                alertBox.style.display = 'block';
            }
        });
    </script>

</body>
</html>
